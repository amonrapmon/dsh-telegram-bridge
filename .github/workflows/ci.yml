name: Node test suite
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Resolve Harness SDK peer dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify plugin entrypoint loads
        run: node -e "import('./lib/index.js').then(m => { if (m.name !== 'dsh-telegram-bridge') process.exit(1) })"
      - name: Unit and mocked integration tests
        run: npm test
      - name: Inspect package
        run: npm pack --dry-run --ignore-scripts

  harness-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact Harness CLI
        run: npm install --global @deepseek-ai/dsh@0.2.0-rc.2 pnpm@11.7.0
      - name: Pack plugin as an installable release artifact
        run: npm pack --ignore-scripts
      - name: Install tarball into a clean Harness profile without credentials
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-bridge-smoke
          CI: 'true'
        run: |
          dsh plugin --profile web add ./amonrapmon-dsh-telegram-bridge-0.1.0.tgz
          dsh plugin --profile web list
          dsh --profile web --dump-config > /tmp/dsh-bridge-composed.yml
          grep -Fq '@amonrapmon/dsh-telegram-bridge' /tmp/dsh-bridge-composed.yml
          grep -Fq 'id: dsh-telegram-bridge' /tmp/dsh-bridge-composed.yml
