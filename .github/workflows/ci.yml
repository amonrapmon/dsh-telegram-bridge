name: Node test suite
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Resolve Harness SDK peer dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify plugin entrypoint loads
        run: node -e "import('./lib/index.js').then(m => { if (m.name !== 'dsh-telegram-bridge') process.exit(1) })"
      - name: Unit and mocked integration tests
        run: npm test
      - name: Inspect package
        run: npm pack --dry-run --ignore-scripts

  harness-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact Harness CLI
        run: npm install --global @deepseek-ai/dsh@0.2.0-rc.2 pnpm@11.7.0
      - name: Pack plugin as an installable release artifact
        run: npm pack --ignore-scripts
      - name: Install tarball into a clean Harness profile without credentials
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-bridge-smoke
          CI: 'true'
        run: |
          dsh plugin --profile web add ./amonrapmon-dsh-telegram-bridge-0.1.0.tgz
          dsh plugin --profile web list
          dsh --profile web --dump-config > /tmp/dsh-bridge-composed.yml
          grep -Fq '@amonrapmon/dsh-telegram-bridge' /tmp/dsh-bridge-composed.yml
          grep -Fq 'id: dsh-telegram-bridge' /tmp/dsh-bridge-composed.yml
      - name: Verify real Harness invokes Bridge using fake Telegram API
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-bridge-smoke
          DSH_TELEGRAM_TOKEN: 987654321:THIS_IS_NOT_A_REAL_TOKEN
          DSH_TELEGRAM_ALLOWED_USER_IDS: '777777'
          DSH_TELEGRAM_DIAGNOSTICS: '1'
          MOCK_TELEGRAM_TRACE: ${{ runner.temp }}/telegram-smoke.trace
        shell: bash
        run: |
          set -eu
          export NODE_OPTIONS="--import=${GITHUB_WORKSPACE}/tests/mock-telegram-fetch.mjs"
          timeout 35s dsh --profile web --no-open --port 3187 > /tmp/dsh-live-smoke.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if test -s "$MOCK_TELEGRAM_TRACE" && grep -Fxq 'sendMessage:group-new-success' "$MOCK_TELEGRAM_TRACE"; then
              echo 'Harness handled /start and /new, owner approved a group, and /new created a real group-topic session.'
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              echo 'Harness exited prematurely.' >&2
              sed -E 's/(token=)[^ ]+/\1[REDACTED]/g' /tmp/dsh-live-smoke.log | tail -60
              exit 1
            fi
            sleep 1
          done
          echo 'Bridge did not complete group onboarding and topic session creation.' >&2
          cat "$MOCK_TELEGRAM_TRACE" 2>/dev/null || true
          sed -E 's/(token=)[^ ]+/\1[REDACTED]/g' /tmp/dsh-live-smoke.log | tail -60
          exit 1

