name: Node test suite
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Resolve Harness SDK peer dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify plugin entrypoint loads
        run: node -e "import('./lib/index.js').then(m => { if (m.name !== 'dsh-telegram-bridge') process.exit(1) })"
      - name: Unit and mocked integration tests
        run: npm test
      - name: Inspect package
        run: npm pack --dry-run --ignore-scripts
